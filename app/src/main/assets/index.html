<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탁구대회 운영센터</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f4f8;color:#182b40;font:16px system-ui}header{background:#102d45;color:white;padding:24px}main{max-width:1250px;margin:auto;padding:20px}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #c5d2df;border-radius:7px}button{background:#126c73;color:white;cursor:pointer;margin:3px}button.alt{background:#52677b}section{background:white;border-radius:12px;padding:18px;margin:15px 0;overflow:auto}h2{margin-top:0}textarea{width:100%;min-height:100px}table{border-collapse:collapse;width:100%}td,th{padding:9px;text-align:left;border-bottom:1px solid #e1e7ee}th{background:#edf4f6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.tile{background:white;padding:18px;border-radius:12px;border-top:4px solid #168b86}.tile b{display:block;font-size:25px}small{color:#52677b}nav{display:flex;flex-wrap:wrap}input[type=number]{width:65px}.court{background:#e8f5f1;padding:12px;border-radius:8px} @media print{button,nav,textarea,.hide{display:none}body{background:white}}</style><header><h1>🏓 탁구대회 운영센터</h1><div id="heading"></div></header><main><nav id="nav"></nav><div id="app"></div></main><script>
const $=id=>document.getElementById(id), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S;try{S=JSON.parse(localStorage.getItem('ttcup-v1'))}catch{};S=S||{name:'우리 클럽 탁구대회',players:[],events:{},matches:[]};let tab='현황',ev='단식';const save=()=>{try{localStorage.setItem('ttcup-v1',JSON.stringify(S))}catch{alert('자동 저장 실패: 백업 파일을 저장하세요.')}};const uid=()=>Math.random().toString(36).slice(2);function go(t){tab=t;render()}function eventGo(t){ev=t;render()}function match(e,a,b,stage,g){return {id:uid(),e,a,b,stage,g,score:[],court:0}}function win(m){let a=m.score.filter(x=>x[0]>x[1]).length,b=m.score.filter(x=>x[1]>x[0]).length;let n=m.e==='단체전'?2:3;return a>=n?m.a:b>=n?m.b:null}function scoreText(m){return m.score.filter(x=>x[0]!==x[1]).map(x=>x.join(':')).join(' / ')||'미입력'}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function setup(){let names=$('entries').value.split('\n').map(x=>x.trim()).filter(Boolean);if(new Set(names).size!==names.length)return alert('중복 참가명이 있습니다.');if(names.length<2)return alert('2팀 이상 입력하세요.');if(S.matches.some(m=>m.e===ev)&&!confirm('이 종목의 기존 대진과 결과를 모두 삭제할까요?'))return;let n=ev==='단체전'?1:Math.min(Math.floor(names.length/2),Math.max(1,+$('groups').value||1));let groups=Array.from({length:n},()=>[]);shuffle(names).forEach((x,i)=>groups[i%n].push(x));S.events[ev]={groups,round:0};S.matches=S.matches.filter(m=>m.e!==ev);groups.forEach((g,i)=>g.forEach((a,j)=>g.slice(j+1).forEach(b=>S.matches.push(match(ev,a,b,'예선',i)))));save();render()}function rank(e,g,i){let ms=S.matches.filter(m=>m.e===e&&m.stage==='예선'&&m.g===i);return g.map(a=>{let w=0,l=0,f=0,z=0;ms.filter(m=>win(m)&&(m.a===a||m.b===a)).forEach(m=>{win(m)===a?w++:l++;m.score.forEach(x=>{let y=m.a===a?x:[x[1],x[0]];if(y[0]>y[1])f++;else z++})});return {a,w,l,f,z}}).sort((a,b)=>b.w-a.w||(b.f-b.z)-(a.f-a.z)||a.a.localeCompare(b.a,'ko'))}function advance(){let d=S.events[ev];if(!d)return;let ms=S.matches.filter(m=>m.e===ev&&m.stage===(d.round?'본선 '+d.round:'예선'));if(ms.some(m=>!win(m)))return alert('현재 단계의 모든 경기를 완료하세요.');let names;if(!d.round){if(ev==='단체전')return alert('단체전 리그 완료');let ranked=d.groups.map((g,i)=>rank(ev,g,i));if(ranked.some(r=>r.some((x,i)=>i&&x.w===r[i-1].w&&x.f-x.z===r[i-1].f-r[i-1].z))&&!confirm('승수와 세트 득실이 같은 선수가 있습니다. 현재 가나다순 순위를 적용할까요? 취소 후 운영자가 별도 확인하세요.'))return;names=ranked.flatMap(r=>r.slice(0,Math.min(+$('qual').value||2,r.length)).map(x=>x.a));names=shuffle(names)}else names=[...ms.map(win),...(d.byes||[])];if(names.length===1){d.champion=names[0];save();render();return}let size=2**Math.ceil(Math.log2(names.length)),bye=size-names.length;d.byes=names.slice(0,bye);names=names.slice(bye);d.round++;for(let i=0;i<names.length;i+=2)S.matches.push(match(ev,names[i],names[i+1],'본선 '+d.round,0));save();render()}
function assign(id,c){let m=S.matches.find(x=>x.id===id);c=+c;if(c&&S.matches.some(x=>x.id!==id&&!win(x)&&x.court===c))return alert('해당 탁구대는 사용 중입니다.');m.court=c;save();render()}function edit(id){let m=S.matches.find(x=>x.id===id);let box=$('editor');box.innerHTML=`<h2>${E(m.a)} vs ${E(m.b)}</h2><small>${m.e==='단체전'?'단식 1 / 단식 2 / 복식 각각의 세트 승수 (3:0, 3:1, 3:2)':'세트별 실제 점수 (11점, 듀스 2점 차)'}</small>`+Array.from({length:m.e==='단체전'?3:5},(_,i)=>`<p>${m.e==='단체전'?['단식 1','단식 2','복식'][i]:(i+1)+'세트'} <input type=number min=0 id="a${i}" value="${m.score[i]?.[0]??''}"> : <input type=number min=0 id="b${i}" value="${m.score[i]?.[1]??''}"></p>`).join('')+`<button onclick="record('${id}')">결과 저장</button><button class=alt onclick="$('editor').innerHTML=''">닫기</button>`;box.scrollIntoView({behavior:'smooth'})}function record(id){let m=S.matches.find(x=>x.id===id),s=[],a=0,b=0,n=m.e==='단체전'?2:3;let d=S.events[m.e];if(d?.champion||d?.round&&(m.stage==='예선'||m.stage!=='본선 '+d.round))return alert('다음 단계가 생성되어 이전 결과를 수정할 수 없습니다.');let blank=false;for(let i=0;i<(n===2?3:5);i++){let x=$('a'+i).value,y=$('b'+i).value;if(x===''&&y===''){blank=true;continue}if(blank||x===''||y===''||a===n||b===n)return alert('경기 순서와 종료 조건을 확인하세요.');x=+x;y=+y;if(!Number.isInteger(x)||!Number.isInteger(y)||Math.min(x,y)<0||(n===2?Math.max(x,y)!==3||Math.min(x,y)>2:Math.max(x,y)!==Math.max(11,Math.min(x,y)+2)))return alert('올바른 점수를 입력하세요.');s.push([x,y]);x>y?a++:b++}m.score=s;if(win(m))m.court=0;save();render()}
function rows(ms){return `<table><tr><th>종목 / 단계</th><th>대진</th><th>탁구대</th><th>결과</th><th>관리</th></tr>${ms.map(m=>`<tr><td>${m.e} · ${m.stage}${m.stage==='예선'?' '+(m.g+1)+'조':''}</td><td>${E(m.a)} vs ${E(m.b)}</td><td>${win(m)?'완료':`<select onchange="assign('${m.id}',this.value)">${Array.from({length:9},(_,i)=>`<option value=${i} ${m.court===i?'selected':''}>${i?i+'번':'대기'}</option>`).join('')}</select>`}</td><td>${E(scoreText(m))}${win(m)?'<br><b>승: '+E(win(m))+'</b>':''}</td><td><button onclick="edit('${m.id}')">입력</button></td></tr>`).join('')}</table>`}function render(){ $('heading').textContent=S.name+' · 8개 탁구대 · 5세트 3선승';$('nav').innerHTML=['현황','참가자','종목 운영','전체 경기','백업'].map(t=>`<button class="${tab===t?'':'alt'}" onclick="go('${t}')">${t}</button>`).join('');let h='',done=S.matches.filter(win).length;if(tab==='현황'){h=`<div class=grid>${[['참가자',S.players.length+'명'],['전체 경기',S.matches.length],['완료',done],['진행률',Math.round(done/(S.matches.length||1)*100)+'%']].map(x=>`<div class=tile>${x[0]}<b>${x[1]}</b></div>`).join('')}</div><section><h2>탁구대 실시간 현황</h2><div class=grid>${Array.from({length:8},(_,i)=>{let m=S.matches.find(m=>m.court===i+1&&!win(m));return `<div class=court><b>${i+1}번 탁구대</b><p>${m?E(m.a)+' vs '+E(m.b):'사용 가능'}</p>${m?`<button onclick="edit('${m.id}')">결과 입력</button>`:''}</div>`}).join('')}</div></section><section><h2>종목별 현황</h2>${['단식','복식','단체전'].map(e=>`<p>${e}: ${S.matches.filter(m=>m.e===e&&win(m)).length} / ${S.matches.filter(m=>m.e===e).length} 경기 ${S.events[e]?.champion?' · 우승 '+E(S.events[e].champion):''}</p>`).join('')}</section>`}if(tab==='참가자')h=`<section><h2>대회 및 참가자 등록</h2><input id=title value="${E(S.name)}"><p>약 80명 기준 · 한 줄에 한 명씩 입력 (동명이인은 소속 등을 추가)</p><textarea id=players>${E(S.players.join('\n'))}</textarea><button onclick="playersSave()">저장</button></section>`;if(tab==='종목 운영'){let d=S.events[ev];h=`<section>${['단식','복식','단체전'].map(e=>`<button class=${ev===e?'':'alt'} onclick="eventGo('${e}')">${e}</button>`).join('')}<h2>${ev} 대진 생성</h2><p>${ev==='단식'?'참가자 이름':ev==='복식'?'복식조 이름 (예: 김철수 / 박영희)':'팀 이름'}을 한 줄씩 입력하세요.</p><textarea id=entries>${E(d?d.groups.flat().join('\n'):ev==='단식'?S.players.join('\n'):'')}</textarea>${ev==='단체전'?'전체 팀 리그 방식':'조 수 <input id=groups type=number min=1 value='+ (d?.groups.length|| (ev==='단식'?16:8))+'>'}<button onclick="setup()">무작위 조 편성 및 대진 생성</button></section>`;if(d){h+=`<section><h2>조별 순위</h2>${d.groups.map((g,i)=>`<h3>${i+1}조</h3><table><tr><th>순위</th><th>선수/팀</th><th>승</th><th>패</th><th>세트(단체전은 매치) 득실</th></tr>${rank(ev,g,i).map((r,j)=>`<tr><td>${j+1}</td><td>${E(r.a)}</td><td>${r.w}</td><td>${r.l}</td><td>${r.f-r.z}</td></tr>`).join('')}</table>`).join('')}${ev!=='단체전'?`<p>조별 진출 인원 <input id=qual type=number min=1 value=2> <button onclick="advance()">${d.round?'다음 본선 라운드 / 우승 확정':'본선 생성'}</button></p>${d.byes?.length?'현재 라운드 부전승: '+E(d.byes.join(', ')):''}${d.champion?'<h2>🏆 우승 '+E(d.champion)+'</h2>':''}`:''}</section><section><h2>경기 목록</h2>${rows(S.matches.filter(m=>m.e===ev))}</section>`}}if(tab==='전체 경기')h=`<section><h2>전체 경기</h2>${rows(S.matches)}</section>`;if(tab==='백업')h=`<section><h2>데이터 관리</h2><p>이 브라우저에 자동 저장됩니다. 다른 기기로 옮길 때 백업을 사용하세요.</p><button onclick="backup()">백업 저장</button><input type=file accept=.json onchange="restore(this)"><button onclick="window.print()">현재 화면 인쇄</button></section>`;$('app').innerHTML=h+'<section id=editor></section>'}function playersSave(){let p=$('players').value.split('\n').map(x=>x.trim()).filter(Boolean);if(new Set(p).size!==p.length)return alert('중복 이름을 확인하세요.');S.players=p;S.name=$('title').value;save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='탁구대회_백업.json';a.click()}async function restore(i){try{let d=JSON.parse(await i.files[0].text());if(!Array.isArray(d.players)||!Array.isArray(d.matches)||!d.events)throw 0;if(confirm('현재 데이터를 백업 내용으로 교체할까요?')){S=d;save();render()}}catch{alert('백업 파일을 확인하세요.')}}render();</script></html>
